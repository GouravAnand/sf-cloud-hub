<template>
  <lightning-card title="Account Search and Contacts">
    <div class="slds-p-around_medium">
      <lightning-input
        label="Account Name"
        placeholder="Type to search accounts"
        value={searchKey}
        oninput={handleSearchChange}
      >
      </lightning-input>

      <template if:true={hasAccounts}>
        <div class="slds-box slds-m-top_small">
          <template for:each={accounts} for:item="account">
            <div
              key={account.Id}
              class="slds-p-vertical_x-small slds-border_bottom"
            >
              <!-- Button to select account -->
              <button
                class="slds-button slds-button_reset slds-text-link"
                type="button"
                data-id={account.Id}
                data-name={account.Name}
                onclick={handleAccountSelect}
              >
                {account.Name}
              </button>

              <!-- Hyperlink to select account -->
              <a
                href="javascript:void(0)"
                class="slds-text-link slds-m-left_medium"
                data-id={account.Id}
                data-name={account.Name}
                onclick={handleAccountSelect}
              >
                Select {account.Name}
              </a>
            </div>
          </template>
        </div>
      </template>

      <template if:true={selectedAccountName}>
        <div class="slds-m-top_medium">
          <p class="slds-text-title_bold">Selected Account</p>
          <p>{selectedAccountName}</p>
        </div>
      </template>

      <template if:true={hasSelectedAccount}>
        <c-child-cmp1 account-id={selectedAccountId}></c-child-cmp1>
      </template>

      <template if:true={error}>
        <div class="slds-text-color_error slds-m-top_medium">
          An error occurred while searching accounts.
        </div>
      </template>
    </div>
  </lightning-card>
</template>
