<template>
  <lightning-card title="Platform Event Publisher">
    <div class="slds-p-around_medium">
      <lightning-textarea
        label="Message"
        value={message}
        onchange={handleMessageChange}
        placeholder="Type a message to publish to the platform event"
      >
      </lightning-textarea>

      <lightning-input
        class="slds-m-top_small"
        label="Category"
        value={category}
        onchange={handleCategoryChange}
        placeholder="General"
      >
      </lightning-input>

      <div class="slds-m-top_medium">
        <lightning-button
          variant="brand"
          label="Publish Event"
          onclick={handlePublish}
          disabled={isPublishDisabled}
          is-loading={isLoading}
        >
        </lightning-button>
      </div>

      <template if:true={error}>
        <div class="slds-m-top_medium slds-text-color_error">{error}</div>
      </template>
    </div>
  </lightning-card>
</template>
